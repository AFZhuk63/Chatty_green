# docker-compose.yml Chatty_green

services:
  chatty_db:   # <-- было db
    build: ./db
    container_name: chatty_db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${PG_NAME}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    volumes:
      - chatty_postgres_data:/var/lib/postgresql/data
    ports:
      - "5440:5432"   # <-- уникальный порт
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chatty_net

  psql:
    image: postgres:13-alpine
    container_name: chatty_psql
    depends_on:
      - chatty_db
    env_file:
      - .env
    command: sh -c "exec psql -h chatty_db -p 5432 -U ${PG_USER} -d ${PG_NAME}"
    tty: true
    networks:
      - chatty_net

  web:
    image: chatty_green_web:latest      # <-- добавили
    build: .
    container_name: chatty_web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8010:8000"   # <-- уникальный порт
    depends_on:
      - chatty_db
    env_file:
      - .env
    environment:
      - DOCKERIZED=1        # <-- добавляем
    volumes:
      - ./static:/app/static
      - ./staticfiles:/app/staticfiles
      - chatty_media:/app/media
    networks:
      - chatty_net

  tests:
    build: .
    command: >
      sh -c "python manage.py check &&
             pytest /app/tests/"
    depends_on:
      - web
      - chatty_db
    environment:
      - DJANGO_SETTINGS_MODULE=chatty.settings
      - PYTHONUNBUFFERED=1
      - DB_HOST=chatty_db
      - DB_PORT=5432
      - RUN_MIGRATIONS=true  # Разрешаем миграции для тестов
    entrypoint: [ ]  # Переопределяем entrypoint из Dockerfile
    volumes:
      - ./static:/app/static
      - ./staticfiles:/app/staticfiles
    env_file: # <-- добавьте это!
      - .env
    networks:
      - chatty_net


